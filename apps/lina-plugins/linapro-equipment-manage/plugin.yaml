# Plugin identifier, unique across the host and source plugin directories.
# 插件唯一标识，必须在宿主和源码插件目录中保持唯一。
id: linapro-equipment-manage

# Plugin display name used in plugin management, menu governance, and docs.
# 插件显示名称，用于插件管理、菜单治理和文档展示。
name: 设备管理

# Plugin semantic version used for plugin sync, upgrades, and delivery asset identity.
# 插件语义化版本号，用于插件同步、升级和交付资产识别。
version: v0.1.0

# Plugin type enum. Allowed values: `source` is compiled with the host; `dynamic` is loaded as a runtime plugin artifact.
# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# Plugin distribution governance enum.
# 插件分发治理枚举。
distribution: managed

# Multi-tenant scope enum.
# 多租户作用域枚举。
scope_nature: tenant_aware

# Multi-tenant support flag.
# 多租户支持标记。
supports_multi_tenant: true

# Default install mode enum.
# 默认安装模式枚举。
default_install_mode: tenant_scoped

# Plugin capability summary.
# 插件能力说明。
description: 提供设备登记与维护记录管理的官方源码插件

# Plugin author or owning team.
# 插件作者或归属团队。
author: linapro

# Plugin license identifier.
# 插件许可证标识。
license: Apache-2.0

# Plugin internationalization config.
# 插件国际化配置。
i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

# Plugin menu declaration list.
# 插件菜单声明列表。
menus:
  - key: plugin:linapro-equipment-manage:equipment
    parent_key: content
    name: 设备登记
    path: /equipment/register
    component: system/plugin/dynamic-page
    perms: equipment:list
    icon: lucide:monitor-cog
    type: M
    sort: 6
    remark: 设备管理插件-设备登记
  - key: plugin:linapro-equipment-manage:equipment:query
    parent_key: plugin:linapro-equipment-manage:equipment
    name: 设备查询
    perms: equipment:query
    type: B
    sort: 1
  - key: plugin:linapro-equipment-manage:equipment:add
    parent_key: plugin:linapro-equipment-manage:equipment
    name: 设备新增
    perms: equipment:add
    type: B
    sort: 2
  - key: plugin:linapro-equipment-manage:equipment:edit
    parent_key: plugin:linapro-equipment-manage:equipment
    name: 设备修改
    perms: equipment:edit
    type: B
    sort: 3
  - key: plugin:linapro-equipment-manage:equipment:remove
    parent_key: plugin:linapro-equipment-manage:equipment
    name: 设备删除
    perms: equipment:remove
    type: B
    sort: 4
  - key: plugin:linapro-equipment-manage:maintenance
    parent_key: content
    name: 维护记录
    path: /equipment/maintenance
    component: system/plugin/dynamic-page
    perms: maintenance:list
    icon: lucide:wrench
    type: M
    sort: 7
    remark: 设备管理插件-维护记录
  - key: plugin:linapro-equipment-manage:maintenance:query
    parent_key: plugin:linapro-equipment-manage:maintenance
    name: 维护查询
    perms: maintenance:query
    type: B
    sort: 1
  - key: plugin:linapro-equipment-manage:maintenance:add
    parent_key: plugin:linapro-equipment-manage:maintenance
    name: 维护登记
    perms: maintenance:add
    type: B
    sort: 2
  - key: plugin:linapro-equipment-manage:maintenance:edit
    parent_key: plugin:linapro-equipment-manage:maintenance
    name: 维护修改
    perms: maintenance:edit
    type: B
    sort: 3
  - key: plugin:linapro-equipment-manage:maintenance:remove
    parent_key: plugin:linapro-equipment-manage:maintenance
    name: 维护删除
    perms: maintenance:remove
    type: B
    sort: 4

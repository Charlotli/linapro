# Plugin identifier, unique across the host and source plugin directories.
# 插件唯一标识，必须在宿主和源码插件目录中保持唯一。
id: linapro-book-manage

# Plugin display name used in plugin management, menu governance, and docs.
# 插件显示名称，用于插件管理、菜单治理和文档展示。
name: 书籍管理

# Plugin semantic version used for plugin sync, upgrades, and delivery asset identity.
# 插件语义化版本号，用于插件同步、升级和交付资产识别。
version: v0.1.0

# Plugin type enum. Allowed values: `source` is compiled with the host; `dynamic` is loaded as a runtime plugin artifact.
# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# Plugin distribution governance enum.
# 插件分发治理枚举。
distribution: managed

# Multi-tenant scope enum.
# 多租户作用域枚举。
scope_nature: tenant_aware

# Multi-tenant support flag.
# 多租户支持标记。
supports_multi_tenant: true

# Default install mode enum.
# 默认安装模式枚举。
default_install_mode: tenant_scoped

# Plugin capability summary.
# 插件能力说明。
description: 提供书籍登记与借阅管理的官方源码插件

# Plugin author or owning team.
# 插件作者或归属团队。
author: linapro

# Plugin license identifier.
# 插件许可证标识。
license: Apache-2.0

# Plugin internationalization config.
# 插件国际化配置。
i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

# Plugin menu declaration list.
# 插件菜单声明列表。
menus:
  - key: plugin:linapro-book-manage:book
    parent_key: content
    name: 书籍登记
    path: /book/register
    component: system/plugin/dynamic-page
    perms: book:list
    icon: lucide:book-open
    type: M
    sort: 8
    remark: 书籍管理插件-书籍登记
  - key: plugin:linapro-book-manage:book:query
    parent_key: plugin:linapro-book-manage:book
    name: 书籍查询
    perms: book:query
    type: B
    sort: 1
  - key: plugin:linapro-book-manage:book:add
    parent_key: plugin:linapro-book-manage:book
    name: 书籍新增
    perms: book:add
    type: B
    sort: 2
  - key: plugin:linapro-book-manage:book:edit
    parent_key: plugin:linapro-book-manage:book
    name: 书籍修改
    perms: book:edit
    type: B
    sort: 3
  - key: plugin:linapro-book-manage:book:remove
    parent_key: plugin:linapro-book-manage:book
    name: 书籍删除
    perms: book:remove
    type: B
    sort: 4
  - key: plugin:linapro-book-manage:borrow
    parent_key: content
    name: 借阅记录
    path: /book/borrow
    component: system/plugin/dynamic-page
    perms: borrow:list
    icon: lucide:bookmark
    type: M
    sort: 9
    remark: 书籍管理插件-借阅记录
  - key: plugin:linapro-book-manage:borrow:query
    parent_key: plugin:linapro-book-manage:borrow
    name: 借阅查询
    perms: borrow:query
    type: B
    sort: 1
  - key: plugin:linapro-book-manage:borrow:add
    parent_key: plugin:linapro-book-manage:borrow
    name: 借出登记
    perms: borrow:add
    type: B
    sort: 2
  - key: plugin:linapro-book-manage:borrow:edit
    parent_key: plugin:linapro-book-manage:borrow
    name: 借阅修改
    perms: borrow:edit
    type: B
    sort: 3
  - key: plugin:linapro-book-manage:borrow:remove
    parent_key: plugin:linapro-book-manage:borrow
    name: 借阅删除
    perms: borrow:remove
    type: B
    sort: 4

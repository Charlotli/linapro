<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0e17" />
  <title>直播观看</title>
  <!-- The /x/<plugin-id> namespace is a host-enforced stable convention, so
       absolute asset paths stay correct for both /h5 and /h5/ entry forms. -->
  <link rel="stylesheet" href="/x/linapro-live-manage/h5/app.css" />
</head>
<body>
  <main id="app" class="app">
    <!-- 加载骨架 -->
    <section id="loading-section" class="loading-section">
      <div class="skeleton skeleton-player"></div>
      <div class="info-panel">
        <div class="skeleton skeleton-chip"></div>
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-line"></div>
      </div>
    </section>

    <!-- 播放器区域 -->
    <section id="player-section" class="player-section hidden">
      <div class="player-frame">
        <video id="video" class="player-video" playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5" controls preload="metadata"></video>
        <div id="live-badge" class="live-badge hidden"><i class="dot"></i>直播中</div>
        <div id="replay-badge" class="replay-badge hidden">回放</div>
        <div id="viewers-badge" class="viewers-badge hidden" aria-live="off">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="8" r="3.2"/><path d="M3.5 19.2c0-3.2 2.7-5.2 6-5.2s6 2 6 5.2"/><path d="M15.5 5.4a3.2 3.2 0 0 1 0 5.2"/><path d="M17.6 14.4c1.8.7 3 2.2 3 4.3"/></svg>
          <span id="viewers-count">1</span> 人在看
        </div>
        <button id="unmute-hint" class="unmute-hint hidden" type="button" aria-label="开启声音">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 8.5H3.5v7h3L11 19z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
          点击开启声音
        </button>
        <div id="player-error" class="player-error hidden" aria-live="polite">
          <span id="player-error-text"></span>
          <button id="player-retry" type="button">重试</button>
        </div>
      </div>
      <div class="stage-glow" aria-hidden="true"></div>
    </section>

    <!-- 封面预告区域（未开始 / 无直播） -->
    <section id="cover-section" class="cover-section hidden">
      <div class="cover-frame">
        <img id="cover-image" class="cover-image" alt="" />
        <div id="cover-fallback" class="cover-fallback">
          <div class="cover-halo" aria-hidden="true"><i></i><i></i><i></i></div>
          <span class="cover-word">聚会直播</span>
          <span class="cover-sub">L I V E&nbsp;&nbsp;S T R E A M</span>
          <span id="cover-date" class="cover-date hidden"></span>
        </div>
      </div>
      <div class="stage-glow" aria-hidden="true"></div>
    </section>

    <!-- 信息区域：上浮玻璃面板 -->
    <section id="info-section" class="info-section hidden">
      <div class="info-panel">
        <div id="state-chip" class="state-chip"></div>
        <div id="live-room" class="live-room hidden"></div>
        <h1 id="live-title" class="live-title"></h1>
        <div id="live-meta" class="live-meta"></div>
        <div id="program" class="program"></div>
        <!-- 日历订阅入口：仅预告态展示 -->
        <div id="calendar-bar" class="calendar-bar hidden">
          <button id="calendar-open" class="calendar-button primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 2.8v4M16 2.8v4M8 13.5h3"/></svg>
            添加到日历
          </button>
          <button id="calendar-copy" class="calendar-button" type="button">复制订阅链接</button>
        </div>
        <!-- 回放库：仅回放态展示 -->
        <div id="replay-section" class="replay-section hidden">
          <h3 class="replay-heading">往期回放</h3>
          <div id="replay-list" class="replay-list" role="list"></div>
        </div>
        <!-- 工具入口：公告与圣经，播放态与预告态展示 -->
        <div id="tool-row" class="tool-row hidden">
          <button id="tool-announcement" class="tool-button" type="button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6.2-2.5 7.5-2.5 7.5h17S18 14.7 18 8.5"/><path d="M10 19.5a2.2 2.2 0 0 0 4 0"/></svg>
            </span>
            <span class="tool-label">公告</span>
          </button>
          <button id="tool-bible" class="tool-button" type="button">
            <span class="tool-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10.5 5 8.4 4.2 5.5 4.2c-.8 0-1.5.1-2 .2v14.2c.5-.1 1.2-.2 2-.2 2.9 0 5 .8 6.5 2.3 1.5-1.5 3.6-2.3 6.5-2.3.8 0 1.5.1 2 .2V4.4c-.5-.1-1.2-.2-2-.2-2.9 0-5 .8-6.5 2.3z"/><path d="M12 6.5v14.2"/></svg>
            </span>
            <span class="tool-label">圣经</span>
          </button>
        </div>
        <!-- 分享入口：播放态与预告态均展示 -->
        <div id="share-bar" class="share-bar">
          <button id="share-button" class="calendar-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.6"/><circle cx="17.5" cy="5.5" r="2.6"/><circle cx="17.5" cy="18.5" r="2.6"/><path d="M8.4 10.8l6.8-4M8.4 13.2l6.8 4"/></svg>
            <span id="share-button-label">分享直播</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 状态提示区域（暂无直播 / 错误） -->
    <section id="notice-section" class="notice-section hidden">
      <div class="info-panel notice-panel">
        <div id="notice-icon" class="notice-icon"></div>
        <div id="notice-text" class="notice-text">暂无直播</div>
        <button id="retry-button" class="retry-button" type="button">重新加载</button>
      </div>
    </section>

    <footer class="page-footer"><span class="footer-brand">聚会直播</span>直播开始后页面自动进入播放</footer>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- 公告底部面板 -->
  <div id="announcement-overlay" class="sheet-overlay hidden">
    <div class="sheet-mask" data-sheet-close="announcement"></div>
    <div class="sheet-panel" role="dialog" aria-label="公告">
      <div class="sheet-grip" data-sheet-close="announcement" aria-hidden="true"></div>
      <div class="sheet-header">
        <span class="sheet-title">公告</span>
        <button class="sheet-close" type="button" data-sheet-close="announcement" aria-label="关闭公告">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="announcement-list" class="sheet-body announcement-list"></div>
    </div>
  </div>

  <!-- 圣经底部面板：书卷 / 章节 / 阅读 三视图 -->
  <div id="bible-overlay" class="sheet-overlay hidden">
    <div class="sheet-mask" data-sheet-close="bible"></div>
    <div class="sheet-panel" role="dialog" aria-label="圣经">
      <div class="sheet-grip" data-sheet-close="bible" aria-hidden="true"></div>
      <div class="sheet-header">
        <button id="bible-back" class="sheet-back hidden" type="button" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>
        </button>
        <span id="bible-title" class="sheet-title">圣经</span>
        <button class="sheet-close" type="button" data-sheet-close="bible" aria-label="关闭圣经">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="bible-body" class="sheet-body bible-body"></div>
      <div id="bible-nav" class="bible-nav hidden">
        <button id="bible-prev" class="calendar-button" type="button">上一章</button>
        <button id="bible-next" class="calendar-button primary" type="button">下一章</button>
      </div>
    </div>
  </div>

  <script src="/x/linapro-live-manage/h5/hls.light.min.js"></script>
  <script src="/x/linapro-live-manage/h5/app.js"></script>
</body>
</html>

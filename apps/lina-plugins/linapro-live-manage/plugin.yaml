    # Button sort order; lower values appear earlier.
    # 按钮排序值，数值越小越靠前。
    sort: 2
  - key: plugin:linapro-live-manage:room:edit
    # Parent menu key pointing to the room menu.
    # 父级菜单键，指向直播间管理菜单。
    parent_key: plugin:linapro-live-manage:room
    # Button display name.
    # 按钮显示名称。
